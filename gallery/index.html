<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Packaging Gallery | Browse High Resolution Scans</title>
    <meta name="description" content="Large collection of film packaging scans in high resolution">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/gallery.css">
</head>
<body class="gallery-page site-nav-fixed">
    <nav id="siteNav" aria-label="Main navigation">
        <div class="nav-container">
            <button type="button" class="mobile-filters-toggle" id="mobileFiltersToggle" aria-expanded="false" aria-controls="mobileFiltersMenu" aria-label="Open filters menu">
                <i class="ri-filter-3-line" aria-hidden="true"></i>
                <span>Filters</span>
            </button>
            <span class="nav-logo nav-logo--static site-logo">
                <span class="site-logo-mark-wrap" aria-hidden="true">
                    <img class="site-logo-mark site-logo-mark--default" src="/assets/logo.png" alt="" width="32" height="32">
                    <img class="site-logo-mark site-logo-mark--hover" src="/assets/logo_hover.png" alt="" width="32" height="32">
                </span>
                <span class="nav-logo-text">Film Packaging Archive</span>
            </span>
            <button type="button" class="mobile-menu-toggle" id="mobileMenuToggle" aria-expanded="false" aria-controls="mobileMenu" aria-label="Open navigation menu">
                <i class="ri-menu-line" aria-hidden="true"></i>
            </button>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/gallery/">Gallery</a></li>
            </ul>
        </div>
    </nav>

    <div id="mobileMenuBackdrop" class="mobile-menu-backdrop" hidden></div>
    <aside id="mobileMenu" class="mobile-menu mobile-nav-menu" aria-hidden="true" hidden>
        <button type="button" class="mobile-menu-return" aria-label="Return to gallery">
            <i class="ri-arrow-go-back-line" aria-hidden="true"></i>
            Return
        </button>
        <nav class="mobile-menu-nav mobile-menu-nav--centered" aria-label="Mobile navigation">
            <span class="mobile-menu-logo">Gallery</span>
            <a href="/">Home</a>
            <a href="/gallery/">Gallery</a>
        </nav>
    </aside>

    <div id="mobileFiltersBackdrop" class="mobile-menu-backdrop mobile-filters-backdrop" hidden></div>
    <aside id="mobileFiltersMenu" class="mobile-menu mobile-filters-menu" aria-hidden="true" hidden>
        <button type="button" class="mobile-menu-return" aria-label="Return to gallery">
            <i class="ri-arrow-go-back-line" aria-hidden="true"></i>
            Return
        </button>
        <div class="mobile-menu-filters" id="mobileFiltersPanel"></div>
    </aside>

    <div class="container-base gallery-container">
        <aside class="filter-sidebar" id="filterSidebar">
            <div class="sidebar-header">
                <h3 class="text-heading"><span>Filters</span></h3>
            </div>
            
            <div class="search-section">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Type to search...">
                    <span class="search-icon"><i class="ri-search-line"></i></span>
                </div>
            </div>

            <div class="sidebar-header">
                <h3 class="text-heading"><span>Sort By</span> <span class="counter-display"><span id="itemCounter">0</span></span></h3>
            </div>

            <div class="filter-section">
                <div class="filter-icon-container">
                    <i class="ri-sort-desc filter-icon"></i>
                </div>
                <div class="filter-content-wrapper">
                    <button class="filter-toggle" data-target="brand-section">
                        <span>Brand</span>
                        <span class="toggle-icon"><i class="ri-arrow-down-s-line"></i></span>
                    </button>
                    <div class="filter-content" id="brand-section">
                        <div class="filter-options" id="brandFilter"></div>
                    </div>
                </div>
            </div>

            <div class="filter-section">
                <div class="filter-icon-container">
                    <i class="ri-sort-desc filter-icon"></i>
                </div>
                <div class="filter-content-wrapper">
                    <button class="filter-toggle" data-target="format-section">
                        <span>Format</span>
                        <span class="toggle-icon"><i class="ri-arrow-down-s-line"></i></span>
                    </button>
                    <div class="filter-content" id="format-section">
                        <div class="filter-options" id="formatFilter"></div>
                    </div>
                </div>
            </div>

            <div class="filter-section">
                <div class="filter-icon-container">
                    <i class="ri-sort-desc filter-icon"></i>
                </div>
                <div class="filter-content-wrapper">
                    <button class="filter-toggle" data-target="process-section">
                        <span>Process</span>
                        <span class="toggle-icon"><i class="ri-arrow-down-s-line"></i></span>
                    </button>
                    <div class="filter-content" id="process-section">
                        <div class="filter-options" id="processFilter"></div>
                    </div>
                </div>
            </div>

            <div class="filter-section">
                <div class="filter-icon-container">
                    <i class="ri-sort-desc filter-icon"></i>
                </div>
                <div class="filter-content-wrapper">
                    <button class="filter-toggle" data-target="expiry-section">
                        <span>Expiry Dates</span>
                        <span class="toggle-icon"><i class="ri-arrow-down-s-line"></i></span>
                    </button>
                    <div class="filter-content" id="expiry-section">
                        <div class="filter-options" id="expiryFilter"></div>
                    </div>
                </div>
            </div>

            <div class="filter-section">
                <div class="filter-icon-container">
                    <i class="ri-sort-desc filter-icon"></i>
                </div>
                <div class="filter-content-wrapper">
                    <button class="filter-toggle" data-target="sort-section">
                        <span>Latest Added</span>
                        <span class="toggle-icon"><i class="ri-arrow-down-s-line"></i></span>
                    </button>
                    <div class="filter-content" id="sort-section">
                        <div class="filter-options" id="sortModeFilter"></div>
                    </div>
                </div>
            </div>

            <div class="filter-sidebar-actions">
                <button type="button" id="sidebarResetFilters" class="lightbox-btn filter-reset-btn" aria-label="Reset all filters" hidden>
                    <i class="ri-device-recover-line" aria-hidden="true"></i>
                    Reset Filters
                </button>
                <button type="button" class="cta-button mobile-filters-search" aria-label="Apply search and return to gallery">
                    <i class="ri-search-line" aria-hidden="true"></i>
                    Search
                </button>
            </div>
        </aside>

        <main class="container-base gallery-main">

        <div id="galleryContainer" class="gallery-grid">
        </div>
    
            <div id="noResults" class="no-results" style="display: none;">
            <h3>No items found</h3>
            <p>Try adjusting your filters/search or</p>
            <button id="resetFilters" class="btn-base view-btn" style="margin-top: 1rem;">Try Again</button>
        </div>
    </main>
    </div>

    <div id="loadingIndicator" class="loading" role="status" aria-live="polite" aria-busy="false" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p>Loading gallery...</p>
    </div>

    <div id="lightbox" class="lightbox">
        <div class="lightbox-content">
            <button type="button" class="lightbox-btn lightbox-close" aria-label="Close">
                <i class="ri-close-line" aria-hidden="true"></i>
            </button>
            <div class="lightbox-image-container">
                <img id="lightboxImage" src="" alt="">
                <div class="lightbox-zoom-controls">
                    <button class="lightbox-btn zoom-btn" id="zoomOut" aria-label="Zoom out" title="Zoom out">
                        <i class="ri-zoom-out-line"></i>
                    </button>
                    <button class="lightbox-btn zoom-btn" id="zoomIn" aria-label="Zoom in" title="Zoom in">
                        <i class="ri-zoom-in-line"></i>
                    </button>
                    <button class="lightbox-btn zoom-btn" id="rotateBtn" aria-label="Rotate 90 degrees" title="Rotate 90°" style="margin-left:2rem;">
                        <i class="ri-clockwise-2-line"></i>
                    </button>
                    <button class="lightbox-btn zoom-btn" id="zoomReset" aria-label="Reset zoom" title="Reset view"">
                        <i class="ri-aspect-ratio-line"></i>
                    </button>
                </div>
                <div class="lightbox-view-controls">
                    <button class="lightbox-btn view-btn-lightbox" id="frontView">Front View</button>
                    <button class="lightbox-btn view-btn-lightbox" id="backView">Back View</button>
                </div>
            </div>
            <div class="lightbox-info">
                <button class="lightbox-btn lightbox-info-toggle" id="infoToggle" style="display: none;" title="Toggle Info">
                    <i class="ri-information-line"></i>
                </button>
                <div class="lightbox-info-nav" aria-label="Gallery navigation">
                    <button type="button" class="lightbox-btn lightbox-prev" aria-label="Previous entry">&lt;</button>
                    <button type="button" class="lightbox-btn lightbox-next" aria-label="Next entry">&gt;</button>
                    <button type="button" class="lightbox-btn lightbox-random-btn" id="lightboxRandom" aria-label="Random entry" title="Random (R)">
                        <i class="ri-dice-line" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="lightbox-info-main">
                    <h3 id="lightboxTitle"></h3>
                    <div class="lightbox-item-details">
                        <div id="lightboxISO"></div>
                        <div id="lightboxFormat"></div>
                        <div id="lightboxProcess"></div>
                        <div id="lightboxExpiry"></div>
                    </div>
                </div>
                <div class="lightbox-info-side">
                    <button type="button" class="lightbox-btn lightbox-star-btn" id="lightboxStar" aria-pressed="false" aria-label="Star entry" title="Star (S)">
                        <i class="ri-star-line" aria-hidden="true"></i>
                    </button>
                    <div class="lightbox-info-meta">
                        <p id="lightboxFileSize" class="image-meta"></p>
                        <p id="lightboxResolution" class="image-meta"></p>
                        <p id="lightboxScanCredit" class="image-meta"></p>
                        <a id="downloadImage" href="#" class="image-meta" style="text-decoration: underline;"><i class="ri-file-download-line"></i> Download Image</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scroll to top button -->
    <button id="scrollToTop" class="scroll-to-top" type="button" aria-label="Back to top" title="Back to top" hidden>
        <i class="ri-arrow-up-line" aria-hidden="true"></i>
    </button>

    <footer id="siteFooter"></footer>

    <script src="/assets/js/site-footer.js"></script>
    <script src="/assets/js/archive-utils.js"></script>
    <script src="/assets/js/nav.js"></script>
    <script src="/assets/js/scroll-chrome.js"></script>
    <script src="/assets/js/brand-colors.js"></script>
    <script src="/assets/js/gallery-data.js"></script>
    <script src="/assets/js/gallery.js"></script>
</body>
</html>
