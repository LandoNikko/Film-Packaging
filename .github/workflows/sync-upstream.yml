name: Sync Upstream

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/dekuNukem/Film-Packaging.git || true

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream (keep local overrides on conflicts)
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git merge upstream/master -X ours \
            -m "Sync upstream/master — kept local overrides [skip ci]"

      - name: Reconcile upstream catalogue rows
        run: |
          python - <<'PY'
          import csv
          import io
          import subprocess
          from pathlib import Path

          catalog_path = Path("film_packaging/database.csv")
          upstream_csv = subprocess.check_output(
              ["git", "show", "upstream/master:film_packaging/database.csv"],
              text=True,
          )

          with catalog_path.open(encoding="utf-8", newline="") as file:
              local_rows = list(csv.DictReader(file))
              fieldnames = list(local_rows[0].keys()) if local_rows else []

          upstream_rows = list(csv.DictReader(io.StringIO(upstream_csv)))
          if not local_rows or not upstream_rows:
              raise ValueError("Local or upstream database is empty")
          if fieldnames != list(upstream_rows[0].keys()):
              raise ValueError("Local and upstream database schemas differ")

          def by_filename(rows, source):
              result = {}
              for row in rows:
                  filename = row["filename"].strip()
                  if not filename or filename in result:
                      raise ValueError(
                          f"Duplicate or empty filename in {source}: {filename!r}"
                      )
                  result[filename] = row
              return result

          local_by_filename = by_filename(local_rows, "local database")
          upstream_by_filename = by_filename(upstream_rows, "upstream database")

          additions = [
              row for filename, row in upstream_by_filename.items()
              if filename not in local_by_filename
          ]
          overrides = [
              filename for filename in local_by_filename.keys() & upstream_by_filename.keys()
              if local_by_filename[filename] != upstream_by_filename[filename]
          ]

          merged_rows = sorted(
              local_rows + additions,
              key=lambda row: (int(row["index"]), int(row["sub_index"])),
          )

          with catalog_path.open("w", encoding="utf-8", newline="") as file:
              writer = csv.DictWriter(file, fieldnames=fieldnames, lineterminator="\n")
              writer.writeheader()
              writer.writerows(merged_rows)

          print(f"Added {len(additions)} upstream rows.")
          print(f"Kept {len(overrides)} local metadata overrides.")
          PY

      - name: Remove upstream pycache artifacts
        run: |
          git rm -r --cached film_packaging/__pycache__ 2>/dev/null || true
          find . -name "*.pyc" -delete
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          git commit -m "Remove pycache from tracking [skip ci]" || true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install page-generation dependency
        run: python -m pip install Pillow

      - name: Regenerate gallery and catalogue pages
        run: |
          python generate_js_data.py
          cd film_packaging && python update_page.py

      - name: Commit and push
        run: |
          git add film_packaging/database.csv assets/js/gallery-data.js film_packaging/by_*.md
          git commit -m "Auto-sync upstream + regenerate gallery data [skip ci]" || echo "No changes to commit"
          git push
