name: Sync Upstream

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install page-generation dependency
        run: python -m pip install Pillow

      - name: Add upstream remote
        run: git remote add upstream https://github.com/dekuNukem/Film-Packaging.git

      - name: Fetch upstream
        run: git fetch upstream master

      - name: Test upstream sync
        run: |
          python -m unittest discover -s tests -v
          node tests/test_newly_added_badge.js
          node tests/test_image_urls.js

      - name: Merge upstream and reconcile catalogue
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          python sync_upstream.py

      - name: Regenerate gallery and catalogue pages
        run: |
          python generate_js_data.py
          cd film_packaging && python update_page.py

      - name: Commit and push
        run: |
          git add film_packaging/database.csv film_packaging/gallery_updates.json film_packaging/lowres assets/js/gallery-data.js film_packaging/by_*.md
          if ! git diff --cached --quiet || git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "Auto-sync upstream + regenerate gallery data [skip ci]"
          fi
          git push
