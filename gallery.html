<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="canonical" href="/gallery/">
    <title>Redirecting to Gallery…</title>
    <script>
        const galleryPath = location.protocol === 'file:' ? './gallery/index.html' : './gallery/';
        location.replace(galleryPath + location.search + location.hash);
    </script>
</head>
<body>
    <p>Redirecting to <a href="./gallery/index.html">the gallery</a>…</p>
</body>
</html>
